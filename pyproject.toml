[project]
name = "axiom"
version = "0.1.0"
description = "AI Risk Manager for COD/RTO fraud — Razorpay AI Buildathon Track 2"
requires-python = ">=3.10"

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.isort]
profile = "black"
line_length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
